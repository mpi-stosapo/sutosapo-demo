<body>
  <div>
    <p>ページが移動しました。移動しています…</p>
    <p><a id="go" href="/test/nurse/">開かないときは、こちらを押してください</a></p>
  </div>
<script>
  // 以前の住所（/woc/）で開かれたときは、新しい住所（/nurse/）へ移す。?h= などの続きも引き継ぐ
  (function(){
    var to = '/test/nurse/';
    try{ to = '/test/nurse/' + location.search + location.hash; }catch(e){}
    try{ document.getElementById('go').href = to; }catch(e){}
    location.replace(to);
  })();
</script>
<div style="position:fixed;left:0;bottom:0;z-index:2147483647;background:#c00;color:#fff;font-size:11px;padding:2px 6px;pointer-events:none">確認用（本番ではありません）</div></body>
