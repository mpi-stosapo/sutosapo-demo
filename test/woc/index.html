<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#1aabce">
<title>ストサポ紹介ムービー｜ストーマライフ トータルサポート</title>
<link rel="icon" type="image/png" href="/assets/logo/app-icon-180.png">
<style>
  :root { --teal:#16a6cc; --blue-ink:#2b5163; --base:#f2fafc; --line:#d8ecf3; --apricot:#f2a869; --apricot-deep:#e2924e; }
  * { box-sizing:border-box; }
  html { -webkit-text-size-adjust:100%; }
  body { margin:0; background:var(--base); color:var(--blue-ink); font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",sans-serif; line-height:1.8; }
  .hero { background:linear-gradient(165deg,#35bede 0%,#1aabce 55%,#109ac0 100%); color:#fff; padding:28px 20px 56px; border-radius:0 0 50% 50% / 0 0 26px 26px; text-align:center; }
  .hero img { width:56px; height:56px; border-radius:14px; display:block; margin:0 auto 12px; box-shadow:0 4px 14px rgba(13,90,120,.22); }
  .hero h1 { margin:0; font-size:22px; font-weight:700; letter-spacing:.04em; line-height:1.5; }
  .hero p { margin:6px 0 0; font-size:14px; font-weight:600; opacity:.96; }
  main { max-width:640px; margin:-34px auto 0; padding:0 16px 40px; }
  .video { position:relative; aspect-ratio:16/9; background:#0d2f3d; border-radius:14px; overflow:hidden; box-shadow:0 8px 24px rgba(20,90,120,.18); }
  .video iframe { position:absolute; inset:0; width:100%; height:100%; border:0; }
  .note { margin:20px 4px 0; font-size:15px; }
  .btn { display:block; margin:22px 0 0; padding:15px 16px; border-radius:14px; background:linear-gradient(160deg,#f4ac6e 0%,#eb9650 100%); color:#fff; font-size:16px; font-weight:700; text-align:center; text-decoration:none; box-shadow:0 5px 14px rgba(226,146,78,.32); }
  footer { margin-top:26px; font-size:12px; text-align:center; color:#6b8894; }
</style>
</head>
<body>
  <header class="hero">
    <img src="/assets/logo/app-icon-180.png" alt="ストサポ">
    <h1>ストサポ紹介ムービー</h1>
    <p>術直後から、退院後も続く安心を。</p>
  </header>
  <main>
    <div class="video">
      <iframe src="https://player.vimeo.com/video/1241689709?h=425d380e2e&amp;playsinline=1&amp;title=0&amp;byline=0&amp;portrait=0&amp;dnt=1" title="ストサポ紹介ムービー" allow="autoplay; fullscreen; picture-in-picture; encrypted-media" allowfullscreen></iframe>
    </div>
    <p class="note">約3分の動画です。ストサポは、ストーマをお持ちの方に向けて、動画やサポートブック、チャットでの相談などをスマホでご案内するアプリです。</p>
    <a class="btn" href="https://stosapo.jp/">ストサポを開く</a>
    <footer>ストーマライフ トータルサポート「ストサポ」</footer>
  </main>
</body>
</html>
