<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#1aabce">
<title>ストサポ紹介ムービー｜ストーマライフ トータルサポート</title>
<link rel="icon" type="image/png" href="/assets/logo/app-icon-180.png">
<style>
  :root { --teal:#16a6cc; --blue-ink:#2b5163; --base:#f2fafc; --line:#d8ecf3; --apricot:#f2a869; --apricot-deep:#e2924e; }
  * { box-sizing:border-box; }
  html { -webkit-text-size-adjust:100%; }
  body { margin:0; background:var(--base); color:var(--blue-ink); font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",sans-serif; line-height:1.8; }
  .hero { background:linear-gradient(165deg,#35bede 0%,#1aabce 55%,#109ac0 100%); color:#fff; padding:28px 20px 56px; border-radius:0 0 50% 50% / 0 0 26px 26px; text-align:center; }
  .hero img { width:56px; height:56px; border-radius:14px; display:block; margin:0 auto 12px; box-shadow:0 4px 14px rgba(13,90,120,.22); }
  .hero h1 { margin:0; font-size:22px; font-weight:700; letter-spacing:.04em; line-height:1.5; }
  .hero p { margin:6px 0 0; font-size:14px; font-weight:600; opacity:.96; }
  main { max-width:640px; margin:-34px auto 0; padding:0 16px 40px; }
  .video { position:relative; aspect-ratio:16/9; background:#0d2f3d; border-radius:14px; overflow:hidden; box-shadow:0 8px 24px rgba(20,90,120,.18); }
  .video iframe { position:absolute; inset:0; width:100%; height:100%; border:0; }
  .note { margin:20px 4px 0; font-size:15px; }
  .points { margin:14px 4px 0; padding:14px 16px 14px 32px; background:#fff; border:1px solid var(--line); border-radius:14px; font-size:14.5px; line-height:1.7; }
  .points li { margin:0 0 8px; padding-left:2px; }
  .points li:last-child { margin-bottom:0; }
  .points li::marker { color:var(--teal); }
  .btn { display:block; margin:22px 0 0; padding:15px 16px; border-radius:14px; background:linear-gradient(160deg,#f4ac6e 0%,#eb9650 100%); color:#fff; font-size:16px; font-weight:700; text-align:center; text-decoration:none; box-shadow:0 5px 14px rgba(226,146,78,.32); }
  footer { margin-top:26px; font-size:12px; text-align:center; color:#6b8894; }
  /* スマホを横にしたら動画を画面いっぱいに広げる（再生は止めない） */
  @media (orientation:landscape) and (max-height:520px) {
    html, body { background:#000; overflow:hidden; }
    .hero, .note, .points, .btn, footer { display:none; }
    main { max-width:none; margin:0; padding:0; }
    .video { position:fixed; inset:0; width:100vw; height:100vh; height:100dvh; aspect-ratio:auto; border-radius:0; box-shadow:none; background:#000; }
  }
</style>
</head>
<body>
  <header class="hero">
    <img src="/assets/logo/app-icon-180.png" alt="ストサポ">
    <h1>ストサポ紹介ムービー</h1>
    <p>術直後から、退院後も続く安心を。</p>
  </header>
  <main>
    <div class="video">
      <iframe src="https://player.vimeo.com/video/1241689709?h=425d380e2e&amp;playsinline=1&amp;title=0&amp;byline=0&amp;portrait=0&amp;dnt=1" title="ストサポ紹介ムービー" allow="autoplay; fullscreen; picture-in-picture; encrypted-media" allowfullscreen></iframe>
    </div>
    <p class="note">ストサポ(Stoma Life Total Support)は、患者様・ご家族が入院中から学べる、WEBアプリのセルフケア支援ツールです。</p>
    <ul class="points">
      <li>ダウンロードも、会員登録も要りません。スマートフォンですぐに始められます</li>
      <li>患者様目線のアニメーション動画「入院中に観る 装具交換の基本動画」全12本</li>
      <li>お悩みから知る/サポートブック/用品を知る/チャットに相談</li>
      <li>患者様にお渡しできるQRカードをご用意しています</li>
    </ul>
    <a class="btn" href="https://stosapo.jp/">ストサポを開く</a>
    <footer>ストーマライフ トータルサポート「ストサポ」</footer>
  </main>
<script>
  // 記録の受け口（空なら何も送らない）
  window.SS_LOG_URL = '';
  // ===== 病院別QR: アドレスの h（英数字8文字以内）を、端末ごとに初回だけ「開いた」と数える。個人を特定する情報は送らない。URLが空なら何もしない =====
  (function(){
    try{
      var u = window.SS_LOG_URL; if(!u) return;
      var h = new URLSearchParams(location.search).get('h');
      if(!h || !/^[A-Za-z0-9]{1,8}$/.test(h)) return;
      var type = 'woc';
      var key = 'ss_qr_' + type + '_' + h;
      if(localStorage.getItem(key)) return;
      fetch(u, { method:'POST', mode:'no-cors', keepalive:true, body:JSON.stringify({ action:'open', h:h, type:type }) })
        .then(function(){ try{ localStorage.setItem(key, '1'); }catch(e){} })
        .catch(function(){});
    }catch(e){}
  })();
</script>
<div style="position:fixed;left:0;bottom:0;z-index:2147483647;background:#c00;color:#fff;font-size:11px;padding:2px 6px;pointer-events:none">確認用（本番ではありません）</div></body>
</html>
