<!doctype html>
<html lang="ja" class="chk">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://player.vimeo.com">
<link rel="preconnect" href="https://f.vimeocdn.com" crossorigin>
<link rel="preconnect" href="https://i.vimeocdn.com" crossorigin>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#1aabce">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ストサポ">
<title>ストサポ｜ストーマライフ トータルサポート</title>
<link rel="icon" type="image/png" href="/assets/logo/app-icon-180.png">
<link rel="apple-touch-icon" href="/assets/logo/app-icon-180.png">
<style>
  /* 移すか見せるかを決めるまで、画面を隠す（一瞬のちらつきを防ぐ） */
  html.chk body { visibility:hidden; }
  :root { --teal:#16a6cc; --blue-ink:#2b5163; --base:#f2fafc; --line:#d8ecf3; --apricot:#f2a869; --apricot-deep:#e2924e; }
  * { box-sizing:border-box; }
  html { -webkit-text-size-adjust:100%; }
  body { margin:0; background:var(--base); color:var(--blue-ink); font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",sans-serif; font-size:17px; line-height:1.8; }
  .hero { background:linear-gradient(165deg,#35bede 0%,#1aabce 55%,#109ac0 100%); color:#fff; padding:28px 20px 56px; border-radius:0 0 50% 50% / 0 0 26px 26px; text-align:center; }
  .hero img { width:56px; height:56px; border-radius:14px; display:block; margin:0 auto 12px; box-shadow:0 4px 14px rgba(13,90,120,.22); }
  .hero h1 { margin:0; font-size:24px; font-weight:700; letter-spacing:.04em; line-height:1.5; }
  .hero p { margin:6px 0 0; font-size:15px; font-weight:600; opacity:.96; }
  main { max-width:520px; margin:-34px auto 0; padding:0 16px 40px; }
  .video { position:relative; aspect-ratio:4/5; max-width:440px; margin:0 auto; background:#0d2f3d; border-radius:14px; overflow:hidden; box-shadow:0 8px 24px rgba(20,90,120,.18); }
  .video iframe { position:absolute; inset:0; width:100%; height:100%; border:0; }
  .lead { margin:22px 4px 0; font-size:17px; }
  .cap { margin:10px 4px 0; font-size:15px; color:#4b6a79; }
  .btn { display:block; margin:24px 0 0; padding:18px 16px; border-radius:14px; background:linear-gradient(160deg,#f4ac6e 0%,#eb9650 100%); color:#fff; font-size:19px; font-weight:700; text-align:center; text-decoration:none; box-shadow:0 5px 14px rgba(226,146,78,.32); }
  .notice { margin:26px 4px 0; padding:12px 14px; background:#fff; border:1px solid var(--line); border-radius:12px; font-size:13px; line-height:1.7; color:#5b7684; }
  footer { margin-top:22px; font-size:12px; text-align:center; color:#6b8894; }
</style>
<noscript><style>html.chk body { visibility:visible; }</style></noscript>
</head>
<body>
  <header class="hero">
    <img src="/assets/logo/app-icon-180.png" alt="ストサポ">
    <h1>患者様・ご家族様へ</h1>
    <p>術直後から、退院後も続く安心を。</p>
  </header>
  <main>
    <div class="video">
      <iframe id="mv" data-src="https://player.vimeo.com/video/1245003954?h=0df4dd475c&amp;playsinline=1&amp;pip=0&amp;chromecast=0&amp;title=0&amp;byline=0&amp;portrait=0&amp;speed=0&amp;transcript=0&amp;cc=0&amp;vimeo_logo=0&amp;quality_selector=0&amp;dnt=1" title="ストサポ紹介ムービー" allow="autoplay; fullscreen; picture-in-picture; encrypted-media" allowfullscreen></iframe>
    </div>
    <p class="lead">ストサポは、入院中から退院後まで、ストーマのケアの学びを支える、スマートフォンのアプリです。ダウンロードや会員登録は要りません。</p>
    <p class="cap">約2分のムービーです。ストサポでできることと、ホーム画面への追加のしかたをご紹介します。</p>
    <a class="btn" id="open" href="/">ストサポを開く</a>
    <p class="notice">ストサポの内容は、一般的な情報の提供を目的としたものであり、診断や治療にかわるものではありません。症状やケアについてご不安があるときは、ストーマ外来やかかりつけの医療機関にご相談ください。</p>
    <footer>ストーマライフ トータルサポート「ストサポ」</footer>
  </main>
<script>
  // 患者さん用QRの入り口。
  //  ・ホーム画面のアイコンから開いた人、前に導入を見た端末 → すぐアプリへ移す
  //  ・初めての人だけ、この導入を見せる（「ストサポを開く」を押したら「見た」と覚える）
  //  ・アドレスに ?intro=1 を付けると、見たことがある端末でも導入を見せる（確認用）
  (function(){
    var APP = '/';
    var KEY = 'ss_intro_seen';
    var go = APP, standalone = false, seen = false, force = false;
    try{
      var q = new URLSearchParams(location.search);
      var h = q.get('h');
      force = q.get('intro') === '1';
      standalone = window.navigator.standalone === true || (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
      // 病院の番号は、ブラウザで開いたときだけ引き継ぐ（ホーム画面から開いた分は、数えないため）
      if(h && /^[A-Za-z0-9]{1,8}$/.test(h) && !standalone) go = APP + '?h=' + h;
    }catch(e){}
    try{ seen = !!localStorage.getItem(KEY); }catch(e){}
    try{
      var btn = document.getElementById('open');
      btn.href = go;
      btn.addEventListener('click', function(){ try{ localStorage.setItem(KEY, '1'); }catch(e){} });
    }catch(e){}
    if(standalone || (seen && !force)){ location.replace(go); return; }
    try{ var mv = document.getElementById('mv'); mv.src = mv.getAttribute('data-src'); }catch(e){}
    document.documentElement.className = document.documentElement.className.replace('chk', '').trim();
  })();
</script>
</body>
</html>
